<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightPDF Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Toolbar -->
    <div id="toolbar">
        <div class="toolbar-group">
            <button id="btn-open" title="ファイルを開く (Ctrl+O)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
                </svg>
                <span class="btn-label">開く</span>
            </button>
            <button id="btn-print" title="印刷 (Ctrl+P)" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                </svg>
                <span class="btn-label">印刷</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <div class="toolbar-group nav-group">
            <button id="btn-prev" title="前のページ (←)" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <span class="page-info">
                <input type="number" id="page-input" value="1" min="1" disabled>
                <span>/</span>
                <span id="page-count">0</span>
            </span>
            <button id="btn-next" title="次のページ (→)" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <div class="toolbar-group zoom-group">
            <button id="btn-zoom-out" title="縮小 (Ctrl+-)" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M19 13H5v-2h14v2z"/>
                </svg>
            </button>
            <select id="zoom-select" disabled>
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1" selected>100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
                <option value="3">300%</option>
                <option value="fit-width">幅に合わせる</option>
                <option value="fit-page">ページに合わせる</option>
            </select>
            <button id="btn-zoom-in" title="拡大 (Ctrl++)" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <div class="toolbar-group">
            <button id="btn-rotate-left" title="左に回転" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M7.11 8.53L5.7 7.11C4.8 8.27 4.24 9.61 4.07 11h2.02c.14-.87.49-1.72 1.02-2.47zM6.09 13H4.07c.17 1.39.72 2.73 1.62 3.89l1.41-1.42c-.52-.75-.87-1.59-1.01-2.47zm1.01 5.32c1.16.9 2.51 1.44 3.9 1.61V17.9c-.87-.15-1.71-.49-2.46-1.03L7.1 18.32zM13 4.07V1L8.45 5.55 13 10V6.09c2.84.48 5 2.94 5 5.91s-2.16 5.43-5 5.91v2.02c3.95-.49 7-3.85 7-7.93s-3.05-7.44-7-7.93z"/>
                </svg>
            </button>
            <button id="btn-rotate-right" title="右に回転" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M15.55 5.55L11 1v3.07C7.06 4.56 4 7.92 4 12s3.05 7.44 7 7.93v-2.02c-2.84-.48-5-2.94-5-5.91s2.16-5.43 5-5.91V10l4.55-4.45zM19.93 11c-.17-1.39-.72-2.73-1.62-3.89l-1.42 1.42c.54.75.88 1.6 1.02 2.47h2.02zM13 17.9v2.02c1.39-.17 2.74-.71 3.9-1.61l-1.44-1.44c-.75.54-1.59.89-2.46 1.03zm3.89-2.42l1.42 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.02c-.14.87-.48 1.72-1.02 2.48z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <div class="toolbar-group search-group">
            <div class="search-box" id="search-box">
                <input type="text" id="search-input" placeholder="検索... (Ctrl+F)" disabled>
                <span id="search-result-count"></span>
                <button id="btn-search-prev" title="前の検索結果" disabled>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                        <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
                    </svg>
                </button>
                <button id="btn-search-next" title="次の検索結果" disabled>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="toolbar-spacer"></div>

        <div class="toolbar-group">
            <button id="btn-sidebar" title="サイドバー切替">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M3 5h8v2H3V5zm0 4h8v2H3V9zm0 4h8v2H3v-2zm0 4h8v2H3v-2zm10-12h8v14h-8V5z"/>
                </svg>
            </button>
            <button id="btn-dark-mode" title="ダークモード切替">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M9.37 5.51c-.18.64-.27 1.31-.27 1.99 0 4.08 3.42 7.5 7.5 7.5.68 0 1.35-.09 1.99-.27C17.45 17.19 14.93 19 12 19c-3.86 0-7-3.14-7-7 0-2.93 1.81-5.45 4.37-6.49zM12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
                </svg>
            </button>
            <button id="btn-fullscreen" title="全画面表示 (F11)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="main-container">
        <!-- Thumbnail Sidebar -->
        <div id="sidebar" class="hidden">
            <div id="sidebar-tabs">
                <button class="sidebar-tab active" data-tab="thumbnails">サムネイル</button>
                <button class="sidebar-tab" data-tab="outline">目次</button>
            </div>
            <div id="thumbnail-container" class="sidebar-content active"></div>
            <div id="outline-container" class="sidebar-content"></div>
        </div>

        <!-- PDF Viewer Area -->
        <div id="viewer-container">
            <div id="viewer">
                <!-- Drop zone overlay -->
                <div id="drop-zone" class="active">
                    <div class="drop-zone-content">
                        <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor" opacity="0.3">
                            <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
                        </svg>
                        <p>PDFファイルをここにドラッグ&ドロップ</p>
                        <p class="drop-zone-sub">または「開く」ボタンをクリック</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept=".pdf" style="display:none">

    <!-- Loading indicator -->
    <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>読み込み中...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="app.js"></script>
</body>
</html>
